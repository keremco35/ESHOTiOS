name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test (Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # Removed explicit xcode-select to rely on default environment and potentially avoid issues

      - name: Build App
        run: |
          # Find the UUID of the latest iPhone simulator
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | tail -n 1 | grep -oE '[0-9A-F-]{36}')
          echo "Selected Simulator ID: $DEVICE_ID"

          if [ -z "$DEVICE_ID" ]; then
            echo "Error: No iPhone simulator found!"
            exit 1
          fi

          xcodebuild clean build \
            -project IzmirBusApp.xcodeproj \
            -scheme IzmirBusApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
